name: Update Matches

on:
  workflow_dispatch:
  schedule:
    # التشغيل مرتين يومياً
    - cron: '0 9,14 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # إضافة مكتبة فايربيس ومكتبة بلاي رايت
          pip install firebase-admin playwright
          # هذا السطر مهم جداً لتثبيت المتصفح الوهمي الذي سيلتقط الصورة
          python -m playwright install chromium
          
      - name: Run python main.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONIOENCODING: 'utf-8'
        run: python main.py
